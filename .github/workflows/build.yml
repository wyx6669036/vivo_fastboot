name: Build vivo_fastboot

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]
  workflow_dispatch:

env:
  AOSP_TAG: android-5.1.1_r38
  AOSP_TAG_OLD: android-4.4.4_r2
  AOSP_TAG_DEV: android-2.3.7_r1
  AOSP_BASE: https://android.googlesource.com

jobs:
  # =====================================================================
  # Linux 版
  # =====================================================================
  build-linux:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source to temp
        uses: actions/checkout@v4
        with:
          path: _src

      - name: Setup AOSP layout
        run: |
          set -uo pipefail

          mkdir -p aosp/system/core/fastboot
          cp -r _src/. aosp/system/core/fastboot/
          rm -rf aosp/system/core/fastboot/.git

          cd aosp

          clone_at_tag () {
            rm -rf "$2"
            git clone --depth=1 --branch "$AOSP_TAG" \
              "${AOSP_BASE}/$1" "$2"
          }

          echo "===== clone 主依赖 ====="
          clone_at_tag platform/system/core    /tmp/system_core
          clone_at_tag platform/system/extras  /tmp/system_extras
          clone_at_tag platform/external/zlib       external/zlib
          clone_at_tag platform/external/openssl    external/openssl
          clone_at_tag platform/external/libselinux external/libselinux

          echo "===== 拷贝 system/core 子目录 ====="
          mkdir -p system/core
          for dir in include libcutils libsparse libzipfile mkbootimg; do
            if [ -d "/tmp/system_core/$dir" ]; then
              cp -r "/tmp/system_core/$dir" system/core/
              echo "OK   : system/core/$dir"
            else
              echo "MISS : system/core/$dir"
            fi
          done

          echo "===== 拉取 4.4.4_r2 作为补丁源 ====="
          git clone --depth=1 --branch "${AOSP_TAG_OLD}" \
            "${AOSP_BASE}/platform/system/core" /tmp/sc_old
          git clone --depth=1 --branch "${AOSP_TAG_OLD}" \
            "${AOSP_BASE}/platform/system/extras" /tmp/system_extras_old

          echo "===== 补 libcutils 老文件 ====="
          mkdir -p system/core/libcutils system/core/libzipfile
          for f in socket_inaddr_any_server.c \
                   socket_local_client.c \
                   socket_local_server.c \
                   socket_loopback_client.c \
                   socket_loopback_server.c \
                   socket_network_client.c \
                   load_file.c ; do
            if [ ! -f "system/core/libcutils/$f" ] && [ -f "/tmp/sc_old/libcutils/$f" ]; then
              cp "/tmp/sc_old/libcutils/$f" system/core/libcutils/
              echo "补 : libcutils/$f"
            elif [ -f "system/core/libcutils/$f" ]; then
              echo "有 : libcutils/$f"
            else
              echo "缺 : libcutils/$f"
            fi
          done

          echo "===== 补 libzipfile 老文件 ====="
          for f in centraldir.c zipfile.c ; do
            if [ ! -f "system/core/libzipfile/$f" ] && [ -f "/tmp/sc_old/libzipfile/$f" ]; then
              cp "/tmp/sc_old/libzipfile/$f" system/core/libzipfile/
              echo "补 : libzipfile/$f"
            elif [ -f "system/core/libzipfile/$f" ]; then
              echo "有 : libzipfile/$f"
            else
              echo "缺 : libzipfile/$f"
            fi
          done

          echo "===== 整个 ext4_utils 替换为 4.4.4_r2 版本 ====="
          rm -rf system/extras/ext4_utils
          mkdir -p system/extras
          cp -r /tmp/system_extras_old/ext4_utils system/extras/ext4_utils

          echo "===== 最终 libcutils ====="
          ls system/core/libcutils/
          echo "===== 最终 libzipfile ====="
          ls system/core/libzipfile/
          echo "===== 最终 ext4_utils ====="
          ls system/extras/ext4_utils/

      - name: Install build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libpcre3-dev

      - name: Build Linux fastboot
        working-directory: aosp/system/core/fastboot
        run: |
          sed -i 's|^TOOLCHAIN=.*|TOOLCHAIN=|' makefile
          sed -i 's/\bgettid\b/gettid_selinux/g' \
            ../../../external/libselinux/src/procattr.c
          sed -i 's|^CPPFLAGS+= -DHOST$|CPPFLAGS+= -DHOST\nCPPFLAGS+= -include sys/sysmacros.h|' makefile
          sed -i '/^SRCS+= list\.c[[:space:]]*$/d' makefile
          sed -i 's|^CPPFLAGS+= -D_XOPEN_SOURCE$|CPPFLAGS+= -D_XOPEN_SOURCE\nCPPFLAGS+= -D_FILE_OFFSET_BITS=64|' makefile
          sed -i 's/static inline off64_t lseek64(/static inline off64_t aosp_compat_unused_lseek64(/' \
            ../include/utils/Compat.h

          grep -E '^CPPFLAGS\+=' makefile
          make CC=gcc LD=gcc LIBS="-lpcre -lpthread"

      - name: Upload Linux artifact
        uses: actions/upload-artifact@v4
        with:
          name: fastboot-linux
          path: aosp/system/core/fastboot/fastboot
          if-no-files-found: error

  # =====================================================================
  # Windows 版
  # =====================================================================
  build-windows:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source to temp
        uses: actions/checkout@v4
        with:
          path: _src

      - name: Setup AOSP layout
        run: |
          set -uo pipefail

          mkdir -p aosp/system/core/fastboot
          cp -r _src/. aosp/system/core/fastboot/
          rm -rf aosp/system/core/fastboot/.git

          cd aosp

          # 主 tag：头文件来源
          git clone --depth=1 --branch "$AOSP_TAG" \
            "${AOSP_BASE}/platform/system/core" /tmp/system_core
          git clone --depth=1 --branch "$AOSP_TAG" \
            "${AOSP_BASE}/platform/external/zlib" external/zlib

          mkdir -p system/core
          for dir in include libsparse mkbootimg ; do
            if [ -d "/tmp/system_core/$dir" ]; then
              cp -r "/tmp/system_core/$dir" system/core/
              echo "OK   : system/core/$dir"
            else
              echo "MISS : system/core/$dir"
            fi
          done

          # 4.4.4_r2 的 system/core 和 system/extras
          git clone --depth=1 --branch "${AOSP_TAG_OLD}" \
            "${AOSP_BASE}/platform/system/core" /tmp/sc_old
          git clone --depth=1 --branch "${AOSP_TAG_OLD}" \
            "${AOSP_BASE}/platform/system/extras" /tmp/system_extras_old

          # libzipfile（从 4.4.4_r2 补，5.1.1 已删）
          mkdir -p system/core/libzipfile
          cp /tmp/sc_old/libzipfile/centraldir.c system/core/libzipfile/
          cp /tmp/sc_old/libzipfile/zipfile.c    system/core/libzipfile/
          cp /tmp/sc_old/libzipfile/zipfile.h    system/core/libzipfile/ 2>/dev/null || true
          echo "----- libzipfile -----"
          ls system/core/libzipfile/

          # ext4_utils（只要头文件 + 部分 .c 用于凑 make_ext4fs_sparse_fd）
          mkdir -p system/extras
          cp -r /tmp/system_extras_old/ext4_utils system/extras/ext4_utils

          # ---------- compat 目录 ----------
          echo "===== 创建 compat 目录 ====="
          mkdir -p compat/sys

          # 1) sys/mman.h + mmap64 别名
          cat > compat/sys/mman.h <<'MMAN_EOF'
          #ifndef _STUB_SYS_MMAN_H
          #define _STUB_SYS_MMAN_H
          #include <sys/types.h>
          #include <io.h>
          #include <windows.h>

          #ifndef PROT_READ
          #define PROT_READ  0x1
          #endif
          #ifndef PROT_WRITE
          #define PROT_WRITE 0x2
          #endif
          #ifndef MAP_SHARED
          #define MAP_SHARED  0x01
          #endif
          #ifndef MAP_PRIVATE
          #define MAP_PRIVATE 0x02
          #endif
          #ifndef MAP_FAILED
          #define MAP_FAILED ((void *) -1)
          #endif

          static inline void *
          mmap(void *addr, size_t length, int prot, int flags, int fd, off_t offset)
          {
              (void) addr; (void) flags; (void) offset;
              HANDLE hFile = (HANDLE) _get_osfhandle(fd);
              if (hFile == INVALID_HANDLE_VALUE) return MAP_FAILED;
              DWORD flProtect = (prot & PROT_WRITE) ? PAGE_READWRITE : PAGE_READONLY;
              HANDLE hMap = CreateFileMappingA(hFile, NULL, flProtect, 0, 0, NULL);
              if (hMap == NULL) return MAP_FAILED;
              DWORD dwAccess = (prot & PROT_WRITE) ? FILE_MAP_WRITE : FILE_MAP_READ;
              void *p = MapViewOfFile(hMap, dwAccess, 0, 0, (SIZE_T) length);
              CloseHandle(hMap);
              return p ? p : MAP_FAILED;
          }

          static inline int
          munmap(void *addr, size_t length)
          {
              (void) length;
              return UnmapViewOfFile(addr) ? 0 : -1;
          }

          #ifndef mmap64
          #define mmap64 mmap
          #endif
          #endif
          MMAN_EOF

          # 2) adb_api.h → compat/，去掉 dllimport，避免 __imp_ 符号
          rm -rf /tmp/development
          git clone --depth=1 --branch "${AOSP_TAG_DEV}" \
            "${AOSP_BASE}/platform/development" /tmp/development || true
          SRC_DIR="$(find /tmp/development -name 'adb_api.h' -exec dirname {} \; 2>/dev/null | head -1)"
          echo "adb_api.h 所在目录: $SRC_DIR"
          if [ -n "$SRC_DIR" ]; then
            cp "$SRC_DIR"/*.h compat/ 2>/dev/null || true
          fi
          if [ -f compat/adb_api.h ]; then
            sed -i 's/__declspec(dllimport)//g; s/__declspec(dllexport)//g' compat/adb_api.h
            echo "----- adb_api.h 头部 20 行 -----"
            head -20 compat/adb_api.h
          fi

          # 3) AdbWinApi stub
          cat > compat/adb_api_stub.c <<'ADB_EOF'
          #include <windows.h>

          void *__stdcall AdbCreateInterfaceByName(const wchar_t *n)
          { (void)n; return 0; }

          void *__stdcall AdbOpenDefaultBulkReadEndpoint(void *h, int a, int s, int async)
          { (void)h; (void)a; (void)s; (void)async; return 0; }

          void *__stdcall AdbOpenDefaultBulkWriteEndpoint(void *h, int a, int s, int async)
          { (void)h; (void)a; (void)s; (void)async; return 0; }

          int __stdcall AdbGetInterfaceName(void *h, wchar_t *buf, unsigned long *sz, int ansi)
          { (void)h; (void)buf; (void)sz; (void)ansi; return 0; }

          int __stdcall AdbReadEndpointSync(void *h, void *buf, unsigned long n,
                                            unsigned long *r, unsigned long t, unsigned long *ta)
          { (void)h; (void)buf; (void)n; (void)r; (void)t; (void)ta; return 0; }

          int __stdcall AdbWriteEndpointSync(void *h, void *buf, unsigned long n,
                                             unsigned long *w, unsigned long t)
          { (void)h; (void)buf; (void)n; (void)w; (void)t; return 0; }

          int __stdcall AdbGetUsbDeviceDescriptor(void *h, void *d)
          { (void)h; (void)d; return 0; }

          int __stdcall AdbGetUsbInterfaceDescriptor(void *h, void *d)
          { (void)h; (void)d; return 0; }

          int __stdcall AdbGetSerialNumber(void *h, wchar_t *buf, unsigned long *sz, int ansi)
          { (void)h; (void)buf; (void)sz; (void)ansi; return 0; }

          void *__stdcall AdbEnumInterfaces(const void *g, int a, int b, int c)
          { (void)g; (void)a; (void)b; (void)c; return 0; }

          int __stdcall AdbNextInterface(void *h, void *i, unsigned long *sz)
          { (void)h; (void)i; (void)sz; return 0; }

          int __stdcall AdbCloseHandle(void *h)
          { (void)h; return 1; }
          ADB_EOF

          # 4) ext4_utils 里 make_ext4fs_sparse_fd 的 stub
          cat > compat/ext4_stub.c <<'EXT4_EOF'
          /*
           * Windows 下 ext4_utils 依赖 selinux，编不动。
           * 这里只 stub make_ext4fs_sparse_fd，让 fastboot.exe 能链出。
           * 功能上意味着通过 Windows fastboot 走 sparse 格式化会失败，
           * 但普通 flash / reboot / oem 等命令不受影响。
           */
          int make_ext4fs_sparse_fd(int fd, long long len,
                                    const char *mountpoint,
                                    void *seopts, unsigned nseopts)
          {
              (void)fd; (void)len; (void)mountpoint; (void)seopts; (void)nseopts;
              return -1;
          }
          EXT4_EOF

          echo "----- compat 目录内容 -----"
          ls -la compat/
          ls -la compat/sys/

      - name: Install mingw-w64
        run: |
          sudo apt-get update
          sudo apt-get install -y mingw-w64

      - name: Write Windows makefile
        working-directory: aosp/system/core/fastboot
        run: |
          cat > makefile.win <<'EOF'
          # Windows 版 makefile
          SRCS  = protocol.c
          SRCS += engine.c
          SRCS += bootimg.c
          SRCS += fastboot.c
          SRCS += usb_windows.c
          SRCS += util_windows.c

          VPATH += ../../../external/zlib/src
          SRCS  += adler32.c compress.c crc32.c deflate.c gzclose.c gzlib.c \
                   gzread.c gzwrite.c infback.c inflate.c inftrees.c \
                   inffast.c trees.c uncompr.c zutil.c

          VPATH += ../libsparse
          SRCS  += backed_block.c output_file.c sparse.c sparse_crc32.c \
                   sparse_err.c sparse_read.c

          VPATH += ../libzipfile
          SRCS  += centraldir.c zipfile.c

          VPATH += ../../../compat
          SRCS  += adb_api_stub.c ext4_stub.c

          CPPFLAGS  = -DHOST -DADB_HOST=1 -DHAVE_FORKEXEC=1 -DHAVE_SYMLINKS
          CPPFLAGS += -DHAVE_TERMIO_H -DHAVE_SYS_SOCKET_H -D_GNU_SOURCE -D_XOPEN_SOURCE
          CPPFLAGS += -I. -I../include -I../mkbootimg -I../libsparse/include
          CPPFLAGS += -I../libzipfile
          CPPFLAGS += -I../../extras/ext4_utils
          CPPFLAGS += -I../../../external/zlib
          CPPFLAGS += -I../../../compat

          CFLAGS = -O2 -g -Wall -Wno-unused-parameter -Wno-int-to-pointer-cast
          CFLAGS += -Wno-pointer-to-int-cast -Wno-format
          CFLAGS += -Wno-implicit-function-declaration

          CC = x86_64-w64-mingw32-gcc
          LD = x86_64-w64-mingw32-gcc
          LDFLAGS = -lws2_32 -lsetupapi -luser32 -lkernel32 -ladvapi32

          OBJS = $(SRCS:.c=.o)

          all: fastboot.exe

          fastboot.exe: $(OBJS)
          	$(LD) -o $@ $(LDFLAGS) $(OBJS)

          clean:
          	rm -f $(OBJS) fastboot.exe
          EOF
          echo "===== makefile.win ====="
          cat makefile.win

      - name: Build Windows fastboot.exe
        working-directory: aosp/system/core/fastboot
        run: |
          make -f makefile.win

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: fastboot-windows
          path: aosp/system/core/fastboot/fastboot.exe
          if-no-files-found: error
