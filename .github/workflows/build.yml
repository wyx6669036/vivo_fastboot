name: Build vivo_fastboot

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]
  workflow_dispatch:

env:
  AOSP_TAG: android-5.1.1_r38
  AOSP_TAG_OLD: android-4.4.4_r2
  AOSP_TAG_DEV: android-2.3.7_r1
  AOSP_BASE: https://android.googlesource.com

jobs:
  # =====================================================================
  # Linux 版
  # =====================================================================
  build-linux:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source to temp
        uses: actions/checkout@v4
        with:
          path: _src

      - name: Setup AOSP layout
        run: |
          set -uo pipefail
          mkdir -p aosp/system/core/fastboot
          cp -r _src/. aosp/system/core/fastboot/
          rm -rf aosp/system/core/fastboot/.git
          cd aosp

          clone_at_tag () {
            rm -rf "$2"
            git clone --depth=1 --branch "$AOSP_TAG" \
              "${AOSP_BASE}/$1" "$2"
          }

          clone_at_tag platform/system/core    /tmp/system_core
          clone_at_tag platform/system/extras  /tmp/system_extras
          clone_at_tag platform/external/zlib       external/zlib
          clone_at_tag platform/external/openssl    external/openssl
          clone_at_tag platform/external/libselinux external/libselinux

          mkdir -p system/core
          for dir in include libcutils libsparse libzipfile mkbootimg; do
            if [ -d "/tmp/system_core/$dir" ]; then
              cp -r "/tmp/system_core/$dir" system/core/
              echo "OK   : system/core/$dir"
            else
              echo "MISS : system/core/$dir"
            fi
          done

          git clone --depth=1 --branch "${AOSP_TAG_OLD}" \
            "${AOSP_BASE}/platform/system/core" /tmp/sc_old
          git clone --depth=1 --branch "${AOSP_TAG_OLD}" \
            "${AOSP_BASE}/platform/system/extras" /tmp/system_extras_old

          mkdir -p system/core/libcutils system/core/libzipfile
          for f in socket_inaddr_any_server.c socket_local_client.c \
                   socket_local_server.c socket_loopback_client.c \
                   socket_loopback_server.c socket_network_client.c \
                   load_file.c ; do
            if [ ! -f "system/core/libcutils/$f" ] && [ -f "/tmp/sc_old/libcutils/$f" ]; then
              cp "/tmp/sc_old/libcutils/$f" system/core/libcutils/
              echo "补 : libcutils/$f"
            fi
          done

          rm -rf system/core/libzipfile
          cp -r /tmp/sc_old/libzipfile system/core/libzipfile

          rm -rf system/extras/ext4_utils
          mkdir -p system/extras
          cp -r /tmp/system_extras_old/ext4_utils system/extras/ext4_utils

      - name: Install build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libpcre3-dev

      - name: Build Linux fastboot
        working-directory: aosp/system/core/fastboot
        run: |
          sed -i 's|^TOOLCHAIN=.*|TOOLCHAIN=|' makefile
          sed -i 's/\bgettid\b/gettid_selinux/g' ../../../external/libselinux/src/procattr.c
          sed -i 's|^CPPFLAGS+= -DHOST$|CPPFLAGS+= -DHOST\nCPPFLAGS+= -include sys/sysmacros.h|' makefile
          sed -i '/^SRCS+= list\.c[[:space:]]*$/d' makefile
          sed -i 's|^CPPFLAGS+= -D_XOPEN_SOURCE$|CPPFLAGS+= -D_XOPEN_SOURCE\nCPPFLAGS+= -D_FILE_OFFSET_BITS=64|' makefile
          sed -i 's/static inline off64_t lseek64(/static inline off64_t aosp_compat_unused_lseek64(/' \
            ../include/utils/Compat.h
          make CC=gcc LD=gcc LIBS="-lpcre -lpthread"

      - name: Upload Linux artifact
        uses: actions/upload-artifact@v4
        with:
          name: fastboot-linux
          path: aosp/system/core/fastboot/fastboot
          if-no-files-found: error

  # =====================================================================
  # Windows 版
  # =====================================================================
  build-windows:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source to temp
        uses: actions/checkout@v4
        with:
          path: _src

      - name: Setup AOSP layout
        run: |
          set -uo pipefail

          mkdir -p aosp/system/core/fastboot
          cp -r _src/. aosp/system/core/fastboot/
          rm -rf aosp/system/core/fastboot/.git

          cd aosp

          git clone --depth=1 --branch "$AOSP_TAG" \
            "${AOSP_BASE}/platform/system/core" /tmp/system_core
          git clone --depth=1 --branch "$AOSP_TAG" \
            "${AOSP_BASE}/platform/external/zlib" external/zlib

          mkdir -p system/core
          for dir in include libsparse mkbootimg ; do
            [ -d "/tmp/system_core/$dir" ] && cp -r "/tmp/system_core/$dir" system/core/
          done

          git clone --depth=1 --branch "${AOSP_TAG_OLD}" \
            "${AOSP_BASE}/platform/system/core" /tmp/sc_old
          git clone --depth=1 --branch "${AOSP_TAG_OLD}" \
            "${AOSP_BASE}/platform/system/extras" /tmp/system_extras_old

          rm -rf system/core/libzipfile
          cp -r /tmp/sc_old/libzipfile system/core/libzipfile

          rm -rf system/extras/ext4_utils
          mkdir -p system/extras
          cp -r /tmp/system_extras_old/ext4_utils system/extras/ext4_utils

          # ---------- 从 development 仓库获取 adb_api.h ----------
          echo "===== 克隆 platform/development (老 tag) 获取 adb_api.h ====="
          rm -rf /tmp/development
          git clone --depth=1 --branch "${AOSP_TAG_DEV}" \
            "${AOSP_BASE}/platform/development" /tmp/development || \
            echo "!! 老 tag clone 失败，继续尝试查找"

          echo "===== 查找 adb_api.h ====="
          find /tmp/development -name 'adb_api.h' 2>/dev/null || true

          SRC_DIR=$(find /tmp/development -name 'adb_api.h' -exec dirname {} \; 2>/dev/null | head -1)
          echo "adb_api.h 所在目录: $SRC_DIR"

          mkdir -p compat
          if [ -n "$SRC_DIR" ] && [ -d "$SRC_DIR" ]; then
            cp -v "$SRC_DIR"/*.h compat/
            sed -i 's/__declspec(dllimport)//g; s/__declspec(dllexport)//g' compat/adb_api.h 2>/dev/null || true
            echo "----- compat/adb_api.h 头部 20 行 -----"
            head -20 compat/adb_api.h
          else
            echo "错误：未找到 adb_api.h"
            exit 1
          fi

      - name: Download AdbWinApi.dll from MSYS2
        run: |
          set -e
          mkdir -p /tmp/msys2_dll
          cd /tmp/msys2_dll

          sudo apt-get update
          sudo apt-get install -y zstd curl

          URLS=(
            "https://repo.msys2.org/mingw/ucrt64/mingw-w64-ucrt-x86_64-android-tools-37.0.0-2-any.pkg.tar.zst"
            "https://mirrors.tuna.tsinghua.edu.cn/msys2/mingw/ucrt64/mingw-w64-ucrt-x86_64-android-tools-37.0.0-2-any.pkg.tar.zst"
            "https://mirror.msys2.org/mingw/ucrt64/mingw-w64-ucrt-x86_64-android-tools-37.0.0-2-any.pkg.tar.zst"
          )

          DOWNLOADED=false
          for URL in "${URLS[@]}"; do
            echo "尝试下载: $URL"
            if curl -fL --retry 3 --retry-delay 5 -o android-tools.pkg.tar.zst "$URL"; then
              FILE_SIZE=$(stat -c%s "android-tools.pkg.tar.zst")
              if [ "$FILE_SIZE" -gt 1048576 ]; then
                echo "下载成功，文件大小: $FILE_SIZE bytes"
                DOWNLOADED=true
                break
              else
                echo "文件大小异常 ($FILE_SIZE bytes)，可能下载失败"
              fi
            fi
          done

          if [ "$DOWNLOADED" = false ]; then
            echo "所有下载源均失败，请检查网络"
            exit 1
          fi

          if ! zstd -l android-tools.pkg.tar.zst > /dev/null 2>&1; then
            echo "错误：下载的文件不是有效的 zstd 格式"
            exit 1
          fi

          zstd -d android-tools.pkg.tar.zst -o android-tools.pkg.tar
          tar -xf android-tools.pkg.tar

          echo "===== 查找 DLL ====="
          find . -name 'AdbWinApi.dll' -o -name 'AdbWinUsbApi.dll'

          DLL_DEST="${GITHUB_WORKSPACE}/aosp/compat/dll"
          mkdir -p "$DLL_DEST"
          find . -name 'AdbWinApi.dll'    -exec cp -v {} "$DLL_DEST/" \;
          find . -name 'AdbWinUsbApi.dll' -exec cp -v {} "$DLL_DEST/" \;

          echo "===== $DLL_DEST 内容 ====="
          ls -la "$DLL_DEST/"

      - name: Create compat headers and stubs
        run: |
          set -uo pipefail

          cd aosp

          mkdir -p compat/sys

          cat > compat/sys/mman.h <<'MMAN_EOF'
          #ifndef _STUB_SYS_MMAN_H
          #define _STUB_SYS_MMAN_H
          #include <sys/types.h>
          #include <io.h>
          #include <windows.h>

          #ifndef PROT_READ
          #define PROT_READ  0x1
          #endif
          #ifndef PROT_WRITE
          #define PROT_WRITE 0x2
          #endif
          #ifndef MAP_SHARED
          #define MAP_SHARED  0x01
          #endif
          #ifndef MAP_PRIVATE
          #define MAP_PRIVATE 0x02
          #endif
          #ifndef MAP_FAILED
          #define MAP_FAILED ((void *) -1)
          #endif

          static inline void *
          mmap(void *addr, size_t length, int prot, int flags, int fd, off_t offset)
          {
              (void) addr; (void) flags; (void) offset;
              HANDLE hFile = (HANDLE) _get_osfhandle(fd);
              if (hFile == INVALID_HANDLE_VALUE) return MAP_FAILED;
              DWORD flProtect = (prot & PROT_WRITE) ? PAGE_READWRITE : PAGE_READONLY;
              HANDLE hMap = CreateFileMappingA(hFile, NULL, flProtect, 0, 0, NULL);
              if (hMap == NULL) return MAP_FAILED;
              DWORD dwAccess = (prot & PROT_WRITE) ? FILE_MAP_WRITE : FILE_MAP_READ;
              void *p = MapViewOfFile(hMap, dwAccess, 0, 0, (SIZE_T) length);
              CloseHandle(hMap);
              return p ? p : MAP_FAILED;
          }

          static inline int
          munmap(void *addr, size_t length)
          {
              (void) length;
              return UnmapViewOfFile(addr) ? 0 : -1;
          }

          #ifndef mmap64
          #define mmap64 mmap
          #endif
          #endif
          MMAN_EOF

          cat > compat/adb_api_real.c <<'ADB_REAL_EOF'
          #include <windows.h>
          #include <stdio.h>
          #include <string.h>
          #include <stdbool.h>

          typedef void *ADBAPIHANDLE;

          static HMODULE g_adbwinapi = NULL;

          static void
          ensure_load(void)
          {
              if (g_adbwinapi)
                  return;

              char path[MAX_PATH];
              GetModuleFileNameA(NULL, path, MAX_PATH);
              char *p = strrchr(path, '\\');
              if (p) {
                  *(p + 1) = 0;
                  strcat(path, "AdbWinApi.dll");
              } else {
                  strcpy(path, "AdbWinApi.dll");
              }

              g_adbwinapi = LoadLibraryA(path);

              if (!g_adbwinapi)
                  g_adbwinapi = LoadLibraryA("AdbWinApi.dll");

              if (!g_adbwinapi) {
                  fprintf(stderr,
                      "fastboot: failed to load AdbWinApi.dll "
                      "(error %lu)\n", GetLastError());
              }
          }

          #define ADB_RESOLVE(fn, type) \
              do { \
                  if (!g_##fn) \
                      g_##fn = (type)GetProcAddress(g_adbwinapi, #fn); \
              } while (0)

          typedef ADBAPIHANDLE (*AdbCreateInterfaceByName_t)(const wchar_t *);
          static AdbCreateInterfaceByName_t g_AdbCreateInterfaceByName = NULL;

          ADBAPIHANDLE
          AdbCreateInterfaceByName(const wchar_t *interface_name)
          {
              ensure_load();
              if (!g_adbwinapi) return NULL;
              ADB_RESOLVE(AdbCreateInterfaceByName, AdbCreateInterfaceByName_t);
              if (!g_AdbCreateInterfaceByName) return NULL;
              return g_AdbCreateInterfaceByName(interface_name);
          }

          typedef ADBAPIHANDLE (*AdbOpenDefaultBulkReadEndpoint_t)(
              ADBAPIHANDLE, int, int, int);
          static AdbOpenDefaultBulkReadEndpoint_t g_AdbOpenDefaultBulkReadEndpoint = NULL;

          ADBAPIHANDLE
          AdbOpenDefaultBulkReadEndpoint(ADBAPIHANDLE adb_interface,
                                          int endpoint_index,
                                          int endpoint_type,
                                          int async)
          {
              ensure_load();
              if (!g_adbwinapi) return NULL;
              ADB_RESOLVE(AdbOpenDefaultBulkReadEndpoint,
                          AdbOpenDefaultBulkReadEndpoint_t);
              if (!g_AdbOpenDefaultBulkReadEndpoint) return NULL;
              return g_AdbOpenDefaultBulkReadEndpoint(
                  adb_interface, endpoint_index, endpoint_type, async);
          }

          typedef ADBAPIHANDLE (*AdbOpenDefaultBulkWriteEndpoint_t)(
              ADBAPIHANDLE, int, int, int);
          static AdbOpenDefaultBulkWriteEndpoint_t g_AdbOpenDefaultBulkWriteEndpoint = NULL;

          ADBAPIHANDLE
          AdbOpenDefaultBulkWriteEndpoint(ADBAPIHANDLE adb_interface,
                                           int endpoint_index,
                                           int endpoint_type,
                                           int async)
          {
              ensure_load();
              if (!g_adbwinapi) return NULL;
              ADB_RESOLVE(AdbOpenDefaultBulkWriteEndpoint,
                          AdbOpenDefaultBulkWriteEndpoint_t);
              if (!g_AdbOpenDefaultBulkWriteEndpoint) return NULL;
              return g_AdbOpenDefaultBulkWriteEndpoint(
                  adb_interface, endpoint_index, endpoint_type, async);
          }

          typedef bool (*AdbGetInterfaceName_t)(
              ADBAPIHANDLE, wchar_t *, unsigned long *, int);
          static AdbGetInterfaceName_t g_AdbGetInterfaceName = NULL;

          bool
          AdbGetInterfaceName(ADBAPIHANDLE adb_interface,
                              wchar_t *name,
                              unsigned long *name_size,
                              int ansi)
          {
              ensure_load();
              if (!g_adbwinapi) return false;
              ADB_RESOLVE(AdbGetInterfaceName, AdbGetInterfaceName_t);
              if (!g_AdbGetInterfaceName) return false;
              return g_AdbGetInterfaceName(adb_interface, name, name_size, ansi);
          }

          typedef bool (*AdbReadEndpointSync_t)(
              ADBAPIHANDLE, void *, unsigned long, unsigned long *,
              unsigned long, unsigned long *);
          static AdbReadEndpointSync_t g_AdbReadEndpointSync = NULL;

          bool
          AdbReadEndpointSync(ADBAPIHANDLE adb_endpoint,
                              void *buffer,
                              unsigned long bytes_to_read,
                              unsigned long *bytes_read,
                              unsigned long time_out,
                              unsigned long *time_out_actual)
          {
              ensure_load();
              if (!g_adbwinapi) return false;
              ADB_RESOLVE(AdbReadEndpointSync, AdbReadEndpointSync_t);
              if (!g_AdbReadEndpointSync) return false;
              return g_AdbReadEndpointSync(adb_endpoint, buffer, bytes_to_read,
                                           bytes_read, time_out, time_out_actual);
          }

          typedef bool (*AdbWriteEndpointSync_t)(
              ADBAPIHANDLE, void *, unsigned long, unsigned long *, unsigned long);
          static AdbWriteEndpointSync_t g_AdbWriteEndpointSync = NULL;

          bool
          AdbWriteEndpointSync(ADBAPIHANDLE adb_endpoint,
                               void *buffer,
                               unsigned long bytes_to_write,
                               unsigned long *bytes_written,
                               unsigned long time_out)
          {
              ensure_load();
              if (!g_adbwinapi) return false;
              ADB_RESOLVE(AdbWriteEndpointSync, AdbWriteEndpointSync_t);
              if (!g_AdbWriteEndpointSync) return false;
              return g_AdbWriteEndpointSync(adb_endpoint, buffer, bytes_to_write,
                                            bytes_written, time_out);
          }

          typedef bool (*AdbGetUsbDeviceDescriptor_t)(ADBAPIHANDLE, void *);
          static AdbGetUsbDeviceDescriptor_t g_AdbGetUsbDeviceDescriptor = NULL;

          bool
          AdbGetUsbDeviceDescriptor(ADBAPIHANDLE adb_interface, void *desc)
          {
              ensure_load();
              if (!g_adbwinapi) return false;
              ADB_RESOLVE(AdbGetUsbDeviceDescriptor, AdbGetUsbDeviceDescriptor_t);
              if (!g_AdbGetUsbDeviceDescriptor) return false;
              return g_AdbGetUsbDeviceDescriptor(adb_interface, desc);
          }

          typedef bool (*AdbGetUsbInterfaceDescriptor_t)(ADBAPIHANDLE, void *);
          static AdbGetUsbInterfaceDescriptor_t g_AdbGetUsbInterfaceDescriptor = NULL;

          bool
          AdbGetUsbInterfaceDescriptor(ADBAPIHANDLE adb_interface, void *desc)
          {
              ensure_load();
              if (!g_adbwinapi) return false;
              ADB_RESOLVE(AdbGetUsbInterfaceDescriptor, AdbGetUsbInterfaceDescriptor_t);
              if (!g_AdbGetUsbInterfaceDescriptor) return false;
              return g_AdbGetUsbInterfaceDescriptor(adb_interface, desc);
          }

          typedef bool (*AdbGetSerialNumber_t)(
              ADBAPIHANDLE, wchar_t *, unsigned long *, int);
          static AdbGetSerialNumber_t g_AdbGetSerialNumber = NULL;

          bool
          AdbGetSerialNumber(ADBAPIHANDLE adb_interface,
                             wchar_t *serial_number,
                             unsigned long *serial_number_size,
                             int ansi)
          {
              ensure_load();
              if (!g_adbwinapi) return false;
              ADB_RESOLVE(AdbGetSerialNumber, AdbGetSerialNumber_t);
              if (!g_AdbGetSerialNumber) return false;
              return g_AdbGetSerialNumber(adb_interface, serial_number,
                                          serial_number_size, ansi);
          }

          typedef ADBAPIHANDLE (*AdbEnumInterfaces_t)(
              void *, int, int, int);
          static AdbEnumInterfaces_t g_AdbEnumInterfaces = NULL;

          ADBAPIHANDLE
          AdbEnumInterfaces(void *class_id,
                            int enum_not_present,
                            int single_interface,
                            int close_handle)
          {
              ensure_load();
              if (!g_adbwinapi) return NULL;
              ADB_RESOLVE(AdbEnumInterfaces, AdbEnumInterfaces_t);
              if (!g_AdbEnumInterfaces) return NULL;
              return g_AdbEnumInterfaces(class_id, enum_not_present,
                                         single_interface, close_handle);
          }

          typedef bool (*AdbNextInterface_t)(
              ADBAPIHANDLE, void *, unsigned long *);
          static AdbNextInterface_t g_AdbNextInterface = NULL;

          bool
          AdbNextInterface(ADBAPIHANDLE adb_handle,
                           void *info,
                           unsigned long *size)
          {
              ensure_load();
              if (!g_adbwinapi) return false;
              ADB_RESOLVE(AdbNextInterface, AdbNextInterface_t);
              if (!g_AdbNextInterface) return false;
              return g_AdbNextInterface(adb_handle, info, size);
          }

          typedef bool (*AdbCloseHandle_t)(ADBAPIHANDLE);
          static AdbCloseHandle_t g_AdbCloseHandle = NULL;

          bool
          AdbCloseHandle(ADBAPIHANDLE adb_handle)
          {
              ensure_load();
              if (!g_adbwinapi) return true;
              ADB_RESOLVE(AdbCloseHandle, AdbCloseHandle_t);
              if (!g_AdbCloseHandle) return true;
              return g_AdbCloseHandle(adb_handle);
          }
          ADB_REAL_EOF

          sed -i 's/__cdecl //g' compat/adb_api_real.c
          if ! grep -q 'stdbool.h' compat/adb_api_real.c; then
            sed -i 's|#include <string.h>|#include <string.h>\n#include <stdbool.h>|' compat/adb_api_real.c
          fi

          # ---------- ext4_stub.c：提供 make_ext4fs_sparse_fd ----------
          cat > compat/ext4_stub.c <<'EXT4_STUB_EOF'
          /*
           * ext4_stub.c
           *
           * Windows 下 make_ext4fs.c 依赖 selinux，编不动。
           * 这里只 stub make_ext4fs_sparse_fd，让 fastboot.exe 能链出。
           * 普通 flash / reboot / oem 等命令不受影响；
           * 只有走 sparse 格式化的路径会失败（返回 -1）。
           */
          int make_ext4fs_sparse_fd(int fd, long long len,
                                    const char *mountpoint,
                                    void *seopts, unsigned nseopts)
          {
              (void)fd; (void)len; (void)mountpoint; (void)seopts; (void)nseopts;
              return -1;
          }
          EXT4_STUB_EOF

          echo "----- adb_api_real.c 前 8 行 -----"
          head -8 compat/adb_api_real.c

          echo "----- compat 目录内容 -----"
          ls -la compat/

      - name: Install mingw-w64
        run: |
          sudo apt-get update
          sudo apt-get install -y mingw-w64

      - name: Write Windows makefile
        working-directory: aosp/system/core/fastboot
        run: |
          cat > makefile.win <<'EOF'
          # Windows 版 makefile
          SRCS  = protocol.c
          SRCS += engine.c
          SRCS += bootimg.c
          SRCS += fastboot.c
          SRCS += usb_windows.c
          SRCS += util_windows.c

          VPATH += ../../../external/zlib/src
          SRCS  += adler32.c compress.c crc32.c deflate.c gzclose.c gzlib.c \
                   gzread.c gzwrite.c infback.c inflate.c inftrees.c \
                   inffast.c trees.c uncompr.c zutil.c

          VPATH += ../libsparse
          SRCS  += backed_block.c output_file.c sparse.c sparse_crc32.c \
                   sparse_err.c sparse_read.c

          VPATH += ../libzipfile
          SRCS  += centraldir.c zipfile.c

          VPATH += ../../../compat
          SRCS  += adb_api_real.c ext4_stub.c

          VPATH += ../../extras/ext4_utils
          SRCS  += ext4_utils.c allocate.c contents.c extent.c indirect.c \
                   uuid.c sha1.c wipe.c crc16.c

          CPPFLAGS  = -DHOST -DADB_HOST=1 -DHAVE_FORKEXEC=1 -DHAVE_SYMLINKS
          CPPFLAGS += -DHAVE_TERMIO_H -DHAVE_SYS_SOCKET_H -D_GNU_SOURCE -D_XOPEN_SOURCE
          CPPFLAGS += -DUSE_MINGW
          CPPFLAGS += -I. -I../include -I../mkbootimg -I../libsparse/include
          CPPFLAGS += -I../libzipfile
          CPPFLAGS += -I../../extras/ext4_utils
          CPPFLAGS += -I../../../external/zlib
          CPPFLAGS += -I../../../compat

          CFLAGS = -O2 -g -Wall -Wno-unused-parameter -Wno-int-to-pointer-cast
          CFLAGS += -Wno-pointer-to-int-cast -Wno-format
          CFLAGS += -Wno-implicit-function-declaration

          CC = x86_64-w64-mingw32-gcc
          LD = x86_64-w64-mingw32-gcc
          LIBS = -lws2_32 -lsetupapi -luser32 -lkernel32 -ladvapi32

          OBJS = $(SRCS:.c=.o)

          all: fastboot.exe

          # 注意：库放在对象文件后面，否则 ld 不会从库里拉符号
          fastboot.exe: $(OBJS)
          	$(LD) -o $@ $(OBJS) $(LIBS)

          clean:
          	rm -f $(OBJS) fastboot.exe
          EOF
          echo "===== makefile.win ====="
          cat makefile.win

      - name: Patch ext4_utils for MinGW
        working-directory: aosp/system/extras/ext4_utils
        run: |
          set -uo pipefail

          if ! grep -q 'USE_MINGW' ext4_utils.c; then
            sed -i 's|#include <fcntl.h>|#include <fcntl.h>\n#ifdef USE_MINGW\n#include <winsock2.h>\n#else\n#include <arpa/inet.h>\n#include <sys/ioctl.h>\n#endif|' ext4_utils.c
            sed -i '/^#include <arpa\/inet.h>/d' ext4_utils.c
            sed -i '/^#include <sys\/ioctl.h>/d' ext4_utils.c
            echo "Patched ext4_utils.c"
          fi

          if ! grep -q 'errno.h' ext4_utils.h; then
            sed -i 's|#include <string.h>|#include <string.h>\n#include <errno.h>|' ext4_utils.h
            echo "Patched ext4_utils.h"
          fi

          if ! grep -q 'S_IFLNK' contents.c; then
            sed -i 's|#include "ext4_utils.h"|#include "ext4_utils.h"\n#ifdef USE_MINGW\n#define S_IFLNK 0\n#endif|' contents.c
            echo "Patched contents.c"
          fi

          sed -i 's|#include <string.h>|#include <string.h>\n#include <stdint.h>|' sha1.c 2>/dev/null || true
          sed -i 's|#include <stdint.h>|#include <stdint.h>\n#include <string.h>|' crc16.c 2>/dev/null || true

          echo "===== ext4_utils.c 包含部分 ====="
          head -30 ext4_utils.c

      - name: Build Windows fastboot.exe
        working-directory: aosp/system/core/fastboot
        run: |
          make -f makefile.win

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: fastboot-windows
          path: |
            aosp/system/core/fastboot/fastboot.exe
            aosp/compat/dll/AdbWinApi.dll
            aosp/compat/dll/AdbWinUsbApi.dll
          if-no-files-found: error
