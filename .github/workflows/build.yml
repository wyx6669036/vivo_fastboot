name: Build vivo_fastboot

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Install build dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential gcc g++ make

    - name: Build fastboot binary
      run: |
        # 如果 Makefile 在根目录，直接 make
        # 如果构建文件在子目录，请修改路径，例如 cd fastboot && make
        make

    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: vivo_fastboot-binary
        path: |
          fastboot
          vivo_fastboot
        if-no-files-found: warn
